<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заметки</title>
<style>
    body { 
        background-color: #f0f2f5; 
        font-family: Arial, sans-serif; 
        margin: 0; 
        padding: 20px; 
    }
    
    .container { 
        max-width: 600px; 
        margin: 0 auto; 
    }
    
    header { 
        background-color: #4a90e2; 
        color: white; 
        padding: 15px; 
        text-align: center; 
        border-radius: 8px;
        margin-bottom: 20px;
    }
    
    h1 { 
        margin: 0; 
        font-size: 1.5rem;
    }
    
    form { 
        background: white; 
        padding: 15px; 
        margin-bottom: 20px; 
        border-radius: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
    }
    
    input[type="text"] { 
        flex: 1;
        padding: 8px; 
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    
    button { 
        padding: 8px 15px; 
        background: #4a90e2; 
        color: white; 
        border: none;
        border-radius: 4px;
        cursor: pointer; 
    }
    
    .btn-clear { 
        background-color: #e74c3c;
        margin-left: auto;
    }
    
    ul { 
        list-style: none; 
        padding: 0; 
    }
    
    li { 
        background: white; 
        padding: 10px 15px; 
        margin-bottom: 8px; 
        border-radius: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .note-text {
        flex: 1;
    }
    
    .important { 
        font-weight: bold; 
        color: #d32f2f; 
    }
</style>

</head>
<body>
    <div class="container">
        <header><h1>Мои заметки</h1></header>

        <form action="/add" method="POST">
            <input type="text" name="text" placeholder="Введите текст заметки..." required>
            <label><input type="checkbox" name="important"> Важно</label>
            <button type="submit">Добавить</button>
            <button type="button" class="btn-clear" onclick="clearAll()">Удалить все заметки</button>
        </form>

        <ul>
            {% for note in notes_list %}
            <li>
                <span class="note-text {% if note.important %}important{% endif %}">{{ note.text }}</span>
            </li>
            {% endfor %}
        </ul>
    </div>

    <script>
        function clearAll() {
            if (confirm("Вы уверены, что хотите удалить ВСЕ заметки?")) {
                fetch('/clear', { method: 'DELETE' })
                    .then(() => location.reload());
            }
        }
    </script>
</body>
</html>
