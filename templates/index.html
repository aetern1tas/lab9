<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заметки</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header><h1>Мои заметки</h1></header>

        <form id="noteForm">
            <input type="text" id="noteText" placeholder="Введите текст заметки..." required>
            <label>
                <input type="checkbox" id="noteImportant"> Важно
            </label>
            <button type="button" onclick="addNote()">Добавить</button>
            <button type="button" class="btn-clear" onclick="clearAll()">Удалить все заметки</button>
        </form>

        <ul>
            {% for note in notes_list %}
            <li>
                <span class="note-text {% if note.important %}important{% endif %}">{{ note.text }}</span>
            </li>
            {% endfor %}
        </ul>
    </div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
